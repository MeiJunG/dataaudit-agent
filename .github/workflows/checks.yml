name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s checks -v
      - run: python -m pytest -q tests
      - run: python -m src.cli examples/office_orders.csv --report quality-report-ci.md
